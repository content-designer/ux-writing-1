<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Copy Campfire — what fine-tuning actually touched</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=Newsreader:ital,wght@1,500&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* Copy Campfire design tokens — verbatim from space/app.py — plus the 1920x1080 video stage. */

:root {
  --fire-50: #FFF2E6; --fire-100: #FFE1C6; --fire-200: #FCC596; --fire-300: #FBA968;
  --fire-400: #F7842F; --fire-500: #F2641B; --fire-600: #DA530F; --fire-700: #B23F08;
  --ember-500: #EE8E1E; --gold-400: #D8A94B; --gold-500: #C0892C; --gold-600: #9A6B1E;
  --parch-50: #FCF8EF; --parch-100: #F8F1DF; --parch-200: #F1E7CF; --parch-300: #E6D6B4; --parch-400: #D6C09A;
  --bark-400: #9B7B55; --bark-500: #7A5C3C; --bark-600: #5E4429; --bark-700: #4A3420;
  --bark-800: #362618; --bark-900: #271A0F;
  --pine-500: #6E7B3E; --pine-600: #5C6E33; --pine-700: #45531F;
  --ink-blue: #2F6CB0; --bad-500: #C24A24;
  --text-strong: var(--bark-900); --text-body: var(--bark-800); --text-muted: #6E5B43;
  --text-faint: #927B5E; --text-accent: var(--pine-600);
  --font-display: 'Archivo', system-ui, sans-serif;
  --font-serif: 'Newsreader', Georgia, serif;
  --font-sans: 'Nunito', system-ui, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { background: var(--parch-100); }

/* fixed 1920x1080 stage, centered and scaled to the window for preview */
.stage-wrap {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
}
.stage {
  width: 1920px; height: 1080px; position: relative; overflow: hidden;
  background:
    radial-gradient(1200px 700px at 50% -10%, #FFFDF6 0%, var(--parch-50) 55%, var(--parch-100) 100%);
  color: var(--text-body); font-family: var(--font-sans);
  box-shadow: 0 0 0 1px var(--parch-300), 0 26px 70px rgba(54, 38, 24, .16);
  border-radius: 4px;
}
.stage::after { /* parchment grain */
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .35;
  background-image: radial-gradient(var(--parch-200) 0.8px, transparent 0.8px);
  background-size: 26px 26px;
}
.stage::before { /* campfire glow from just below frame */
  content: ""; position: absolute; left: -240px; right: -240px; bottom: -540px; height: 900px;
  pointer-events: none; z-index: 0;
  background: radial-gradient(58% 100% at 50% 100%,
    rgba(242, 100, 27, .22), rgba(238, 142, 30, .12) 42%, rgba(216, 169, 75, .06) 62%, transparent 75%);
}

/* ambient embers drifting up the whole stage — pure CSS, deterministic */
.stage-embers { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.stage-embers i {
  position: absolute; bottom: -16px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, var(--fire-200), var(--ember-500) 60%, transparent 75%);
  opacity: 0; animation: rise-far linear infinite;
}
@keyframes rise-far {
  0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
  6%   { opacity: .55; }
  55%  { opacity: .3; }
  100% { transform: translateY(-1160px) translateX(var(--drift, 30px)) scale(.35); opacity: 0; }
}
.stage-embers i:nth-child(1)  { left: 6%;  width: 7px;  height: 7px;  animation-duration: 13s; animation-delay: 0s;   --drift: 44px; }
.stage-embers i:nth-child(2)  { left: 14%; width: 5px;  height: 5px;  animation-duration: 17s; animation-delay: 4s;   --drift: -36px; }
.stage-embers i:nth-child(3)  { left: 24%; width: 9px;  height: 9px;  animation-duration: 11s; animation-delay: 7s;   --drift: 24px; }
.stage-embers i:nth-child(4)  { left: 33%; width: 5px;  height: 5px;  animation-duration: 19s; animation-delay: 2s;   --drift: -52px; }
.stage-embers i:nth-child(5)  { left: 45%; width: 8px;  height: 8px;  animation-duration: 12s; animation-delay: 9s;   --drift: 38px; }
.stage-embers i:nth-child(6)  { left: 52%; width: 6px;  height: 6px;  animation-duration: 16s; animation-delay: 1s;   --drift: -20px; }
.stage-embers i:nth-child(7)  { left: 61%; width: 10px; height: 10px; animation-duration: 10s; animation-delay: 5s;   --drift: 56px; }
.stage-embers i:nth-child(8)  { left: 70%; width: 5px;  height: 5px;  animation-duration: 18s; animation-delay: 11s;  --drift: -30px; }
.stage-embers i:nth-child(9)  { left: 79%; width: 7px;  height: 7px;  animation-duration: 14s; animation-delay: 3s;   --drift: 26px; }
.stage-embers i:nth-child(10) { left: 87%; width: 6px;  height: 6px;  animation-duration: 15s; animation-delay: 8s;   --drift: -44px; }
.stage-embers i:nth-child(11) { left: 93%; width: 8px;  height: 8px;  animation-duration: 12s; animation-delay: 6s;   --drift: 20px; }
.stage-embers i:nth-child(12) { left: 39%; width: 4px;  height: 4px;  animation-duration: 21s; animation-delay: 13s;  --drift: 48px; }

/* italic accent word in headlines */
.headline em {
  font-family: var(--font-serif); font-style: italic; font-weight: 500;
  color: var(--fire-600); letter-spacing: 0;
}

.kicker {
  font-family: var(--font-serif); font-style: italic; font-size: 30px;
  color: var(--text-muted); letter-spacing: .01em;
}
.headline {
  font-family: var(--font-display); font-weight: 900; color: var(--text-strong);
  letter-spacing: -0.015em; line-height: 1.04;
}
.footnote {
  position: absolute; left: 90px; right: 90px; bottom: 34px;
  font-family: var(--font-mono); font-size: 17px; line-height: 1.55;
  color: var(--text-faint); border-top: 1px solid var(--parch-300); padding-top: 16px;
}
.footnote b { color: var(--text-muted); font-weight: 600; }

.brand {
  position: absolute; top: 44px; right: 90px; display: flex; align-items: center; gap: 12px;
  font-family: var(--font-display); font-weight: 900; font-size: 26px; color: var(--bark-700);
}
.brand .flame { font-size: 30px; }

/* ember particles */
.ember {
  position: absolute; bottom: -12px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, var(--fire-200), var(--ember-500) 60%, transparent 75%);
  opacity: 0; pointer-events: none;
  animation: rise linear infinite;
}
@keyframes rise {
  0%   { transform: translateY(0) translateX(0) scale(1);   opacity: 0; }
  8%   { opacity: .85; }
  60%  { opacity: .5; }
  100% { transform: translateY(-260px) translateX(var(--drift, 24px)) scale(.45); opacity: 0; }
}

.replay-hint {
  position: absolute; top: 96px; left: 92px;
  font-family: var(--font-mono); font-size: 15px; color: var(--text-faint);
  animation: hintfade 6s forwards; /* disappears before any recorded take */
}
@keyframes hintfade { 0%, 70% { opacity: .75; } 100% { opacity: 0; } }

/* home / back-to-gallery control — mirrors the brand pill, top-left. Subtle by
   default so it stays out of clean recordings; full on hover. */
.home-btn {
  position: absolute; top: 40px; left: 90px; z-index: 6;
  display: inline-flex; align-items: center; gap: 9px;
  font-family: var(--font-display); font-weight: 900; font-size: 18px;
  color: var(--bark-700); text-decoration: none;
  background: #FFFDF6; border: 1px solid var(--parch-300); border-radius: 999px;
  padding: 8px 17px 8px 14px; box-shadow: 0 6px 16px rgba(54, 38, 24, .12);
  opacity: .62; transition: opacity .18s ease, transform .18s ease, box-shadow .18s ease;
}
.home-btn:hover { opacity: 1; transform: translateY(-1px); box-shadow: 0 9px 22px rgba(54, 38, 24, .18); }
.home-btn .flame { font-size: 20px; }


.content { position: absolute; left: 90px; right: 90px; top: 88px; z-index: 1; }
.headline { font-size: 66px; margin-top: 8px; }
.maphead { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
.subline { font-family: var(--font-serif); font-style: italic; font-size: 28px; color: var(--text-muted); }

.map { margin-top: 30px; display: grid; grid-template-columns: 200px 1fr; gap: 0 26px; align-items: center; }
.mod-label { text-align: right; font-family: var(--font-mono); font-size: 19px; color: var(--bark-600);
             height: 58px; display: flex; align-items: center; justify-content: flex-end; }
.mod-label .grp { font-size: 13px; color: var(--text-faint); margin-right: 10px; letter-spacing: .06em; }
.lane { display: grid; grid-template-columns: repeat(64, 1fr); gap: 5px; height: 58px; align-items: center; }
.cell { height: 48px; border-radius: 5px; background: var(--parch-200);
        opacity: 0; transform: scale(.6); }
.cell.on { transition: opacity .45s ease, transform .45s cubic-bezier(.34,1.4,.5,1); }
.cell.absent { background: transparent; border: 1.5px dashed var(--parch-300); height: 26px; border-radius: 4px; }
.cell.hot { box-shadow: 0 0 14px rgba(242,100,27,.55); }

.axis { display: grid; grid-template-columns: 200px 1fr; gap: 0 26px; margin-top: 10px; }
.axis .ticks { display: grid; grid-template-columns: repeat(64, 1fr); gap: 5px;
               font-family: var(--font-mono); font-size: 14px; color: var(--text-faint); }
.axis .ticks span { grid-column: span 8; }
.axis-caption { display: grid; grid-template-columns: 200px 1fr; gap: 0 26px; margin-top: 4px; }
.axis-caption div:last-child { font-family: var(--font-mono); font-size: 15px; color: var(--text-faint); }

.legend { display: flex; align-items: center; gap: 12px;
          font-family: var(--font-mono); font-size: 15px; color: var(--text-muted); }
.legend .scale { width: 220px; height: 14px; border-radius: 7px;
  background: linear-gradient(90deg, #F1E7CF, #D8A94B, #EE8E1E, #F2641B, #B23F08); }

/* bottom band: callout (left) + steady inspector dock (right) — no floating tooltip,
   nothing can clip, and the dock gives the hover story a fixed home for recording */
.below { display: grid; grid-template-columns: 1fr 620px; gap: 0 64px; margin-top: 12px;
         align-items: stretch; }
#inspector { min-height: 168px; border-radius: 12px; padding: 20px 26px 18px;
             border: 2px dashed var(--parch-400); background: transparent;
             display: flex; flex-direction: column; justify-content: center;
             transition: background .25s ease, border-color .25s ease, box-shadow .25s ease; }
#inspector.active { background: #FFFDF6; border: 1px solid var(--parch-300);
                    box-shadow: 0 12px 30px rgba(54,38,24,.14); justify-content: flex-start; }
#inspector .t-idle { font-family: var(--font-serif); font-style: italic; font-size: 23px;
                     line-height: 1.5; color: var(--text-faint); text-align: center; }
#inspector .t-head { font-family: var(--font-display); font-weight: 900; font-size: 23px;
                     color: var(--text-strong); display: flex; align-items: baseline; gap: 12px; }
#inspector .t-heat { font-family: var(--font-serif); font-style: italic; font-size: 19px; }
#inspector .t-body { font-family: var(--font-sans); font-size: 17px; line-height: 1.45;
                     color: var(--text-body); margin-top: 10px; }
#inspector .t-num  { font-family: var(--font-mono); font-size: 14px; color: var(--text-faint); margin-top: 12px; }
.cell:not(.absent) { cursor: crosshair; }
.cell:hover { outline: 2.5px solid var(--bark-800); outline-offset: 1px; }

.callout { font-family: var(--font-serif); font-style: italic; font-size: 25px; line-height: 1.55;
           color: var(--bark-700); opacity: 0; transition: opacity .8s ease 2.4s;
           align-self: center; max-width: 960px; }
.callout b { font-family: var(--font-display); font-style: normal; font-weight: 900; color: var(--fire-600); }
</style>
</head>

const MODULES = [
  { key: "q_proj",   grp: "attention" }, { key: "k_proj", grp: "attention" },
  { key: "v_proj",   grp: "attention" }, { key: "o_proj", grp: "attention" },
  { key: "gate_proj", grp: "mlp" }, { key: "up_proj", grp: "mlp" }, { key: "down_proj", grp: "mlp" },
];
// parchment -> gold -> ember -> fire -> deep fire
const STOPS = [[241,231,207],[216,169,75],[238,142,30],[242,100,27],[178,63,8]];

function heat(t) {
  const x = Math.min(Math.max(t, 0), 1) * (STOPS.length - 1);
  const i = Math.min(Math.floor(x), STOPS.length - 2), f = x - i;
  const c = STOPS[i].map((v, k) => Math.round(v + (STOPS[i + 1][k] - v) * f));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

const lookup = {};
for (const d of DATA.deltas) lookup[d.layer + "|" + d.module] = d;

function build() {
  document.getElementById("subline").textContent =
    `${DATA.adapter} · ${DATA.deltas.length} LoRA deltas across ${DATA.layers} layers`;

  const map = document.getElementById("map");
  map.innerHTML = "";
  for (const mod of MODULES) {
    const label = document.createElement("div");
    label.className = "mod-label";
    label.innerHTML = `<span class="grp">${mod.grp}</span>${mod.key}`;
    map.appendChild(label);
    const lane = document.createElement("div");
    lane.className = "lane";
    for (let layer = 0; layer < DATA.layers; layer++) {
      const cell = document.createElement("div");
      const d = lookup[layer + "|" + mod.key];
      if (d) {
        cell.className = "cell" + (d.intensity > 0.8 ? " hot" : "");
        cell.style.background = heat(d.intensity);
        cell.dataset.norm = d.norm;
        cell.dataset.intensity = d.intensity;
      } else {
        cell.className = "cell absent";
      }
      cell.dataset.layer = layer;
      cell.dataset.module = mod.key;
      lane.appendChild(cell);
    }
    map.appendChild(lane);
  }

  const axis = document.getElementById("axis");
  axis.innerHTML = "<div></div>";
  const ticks = document.createElement("div");
  ticks.className = "ticks";
  for (let l = 0; l < DATA.layers; l += 8) {
    const s = document.createElement("span");
    s.textContent = l;
    ticks.appendChild(s);
  }
  axis.appendChild(ticks);

  const hottest = [...DATA.deltas].sort((a, b) => b.norm - a.norm)[0];
  document.getElementById("callout").innerHTML =
    `The flames concentrate late in the stack — <b>${hottest.module} · layers ` +
    `${Math.max(0, hottest.layer - 4)}–${DATA.layers - 1}</b> burn brightest. ` +
    `Style lives near the surface; the base model's knowledge underneath stays frozen.`;

  document.getElementById("footnote").innerHTML =
    `<b>Real data, not an illustration:</b> each cell is the Frobenius norm of the LoRA delta ` +
    `B·A for one (layer, module) of <b>${DATA.adapter}</b> — computed from the released adapter ` +
    `weights. Color = relative magnitude. Reproduce: scripts/adapter_heatmap.py.`;
}

function animate() {
  document.querySelectorAll(".cell").forEach(c => {
    c.classList.remove("on");
    c.style.opacity = 0; c.style.transform = "scale(.6)";
  });
  const callout = document.getElementById("callout");
  callout.style.opacity = 0;
  void callout.offsetWidth; // flush layout so transitions run (rAF stalls in background tabs)
  document.querySelectorAll(".cell").forEach(c => {
    c.classList.add("on");
    c.style.transitionDelay = (c.dataset.layer * 0.028) + "s";
    c.style.opacity = 1; c.style.transform = "scale(1)";
  });
  callout.style.opacity = 1;
}

// ---- plain-language hover card ----
const MODULE_PLAIN = {
  q_proj:   ["attention · queries", "shapes what the model goes looking for in the surrounding code and copy"],
  k_proj:   ["attention · keys", "shapes how each token advertises itself to be found by others"],
  v_proj:   ["attention · values", "shapes what information actually gets carried once attention lands"],
  o_proj:   ["attention · output", "shapes how everything attention gathered is mixed back into the text"],
  gate_proj:["MLP · gate", "decides which learned features get amplified or muted — a big lever for tone and word choice"],
  up_proj:  ["MLP · expand", "lifts the text into a wider feature space where patterns like “this is an error message” live"],
  down_proj:["MLP · compress", "squeezes the processed features back into the running text"],
};

function heatPhrase(t) {
  if (t > 0.8)  return ["glowing hot", "one of the biggest changes anywhere in the adapter"];
  if (t > 0.55) return ["burning steadily", "fine-tuning leaned on this spot noticeably"];
  if (t > 0.3)  return ["warmed", "clear but moderate adjustments"];
  return ["barely warmed", "almost untouched — the base model's behavior passes through nearly as-is"];
}

function layerPhrase(layer, total) {
  const p = layer / (total - 1);
  if (p > 0.75) return "Late in the stack, where style, phrasing and final word choice take shape.";
  if (p > 0.35) return "Mid-stack, where meaning and relationships between words are worked out.";
  return "Early in the stack, where low-level patterns of code and text are read.";
}

const inspector = document.getElementById("inspector");

function inspectorIdle() {
  inspector.classList.remove("active");
  inspector.innerHTML =
    `<div class="t-idle">Hover any cell on the map —<br>it will tell you what that weight learned.</div>`;
}

function renderInspector(cell) {
  const mod = cell.dataset.module, layer = +cell.dataset.layer;
  const [name, role] = MODULE_PLAIN[mod] || [mod, ""];
  inspector.classList.add("active");
  if (cell.classList.contains("absent")) {
    inspector.innerHTML =
      `<div class="t-head">Layer ${layer} · ${mod} <span class="t-heat" style="color:var(--text-faint)">not present</span></div>` +
      `<div class="t-body">This block uses linear attention, which has no ${mod} — so there was nothing here to fine-tune. The model's 64 blocks mix 48 linear-attention and 16 full-attention layers.</div>`;
  } else {
    const t = +cell.dataset.intensity;
    const [label, meaning] = heatPhrase(t);
    const color = t > 0.55 ? "var(--fire-600)" : t > 0.3 ? "var(--gold-600)" : "var(--text-faint)";
    inspector.innerHTML =
      `<div class="t-head">Layer ${layer} · ${name} <span class="t-heat" style="color:${color}">${label}</span></div>` +
      `<div class="t-body">This weight ${role}. ${meaning.charAt(0).toUpperCase() + meaning.slice(1)}. ${layerPhrase(layer, DATA.layers)}</div>` +
      `<div class="t-num">‖ΔW‖ = ${cell.dataset.norm} · ${(t * 100).toFixed(0)}% of the hottest cell</div>`;
  }
}

document.getElementById("map").addEventListener("mouseover", e => {
  const cell = e.target.closest(".cell");
  if (cell) renderInspector(cell);
});
document.getElementById("map").addEventListener("mouseleave", inspectorIdle);
inspectorIdle();

function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  document.getElementById("stage").style.transform = `scale(${s})`;
}
document.getElementById("stage").style.transformOrigin = "center";
addEventListener("resize", fit); fit();

build();
setTimeout(animate, 600);
addEventListener("click", () => { build(); setTimeout(animate, 120); });
</script>
</body>
</html>
